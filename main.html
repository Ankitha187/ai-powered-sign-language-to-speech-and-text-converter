<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Sign Language Interface | Final Year Project Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --bg-color: #020408;
            --accent-blue: #0093e9;
            --accent-purple: #8029ee;
            --card-glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- TECH BACKGROUND --- */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 80% 20%, rgba(128, 41, 238, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 20% 80%, rgba(0, 147, 233, 0.1) 0%, transparent 40%);
            z-index: 0;
        }

        .container {
            display: flex;
            max-width: 1300px;
            width: 90%;
            gap: 40px;
            z-index: 10;
            align-items: center;
        }

        /* --- LEFT CONTENT --- */
        .left {
            flex: 1;
            animation: slideIn 1s ease-out;
        }

        .left h1 {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(90deg, #4facfe, #9b1fe9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .left h2 {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .accent-line {
            width: 60px;
            height: 4px;
            background: var(--accent-blue);
            border-radius: 2px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        .left p {
            font-size: 18px;
            color: #b0b8d1;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        /* --- IMAGE & CARDS --- */
        .right {
            flex: 1.2;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .image-wrapper {
            width: 100%;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .main-img {
            width: 100%;
            display: block;
            mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
        }

        .scanner {
            position: absolute;
            width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, var(--accent-blue), transparent);
            box-shadow: 0 0 15px var(--accent-blue);
            animation: scanMove 4s infinite linear;
            z-index: 5;
        }

        /* --- BUTTON --- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(90deg, #0093e9 0%, #8029ee 100%);
            padding: 18px 35px;
            border-radius: 50px;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(128, 41, 238, 0.3);
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(128, 41, 238, 0.5);
        }

        .btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* --- HUD CARDS --- */
        .card {
            position: absolute;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            animation: float 5s ease-in-out infinite;
            z-index: 10;
        }

        .card-text { top: 10%; right: -20px; width: 260px; }
        .card-voice { bottom: 10%; left: -20px; width: 300px; animation-delay: 2s; }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .label::before { content: ""; width: 6px; height: 6px; background: var(--accent-blue); border-radius: 50%; }

        /* --- ANIMATIONS --- */
        @keyframes scanMove { 0% { top: 0%; } 100% { top: 100%; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

        /* Visualizer */
        .visualizer { display: flex; align-items: center; gap: 4px; height: 20px; }
        .bar { width: 3px; background: var(--accent-blue); border-radius: 2px; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { height: 5px; } to { height: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="left">
        <h1>AI-Powered</h1>
        <h2>Sign Language to Text and Speech Converter</h2>
        <div class="accent-line"></div>
        <p>Breaking communication barriers with intelligent technology. Convert sign language gestures into accurate text and natural speech in real-time.</p>
        
        <a href="/translator" style="text-decoration: none;">
            <button class="btn">
                <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>
                Start Sign Language Conversion
                <span>→</span>
            </button>
        </a>

        <div style="margin-top: 20px; font-size: 14px; color: #5a5a7a; display: flex; align-items: center; gap: 8px;">
            <svg style="width:16px; height:16px;" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
            Click to enable camera and begin detection
        </div>
    </div>

    <div class="right">
        <div class="image-wrapper">
            <div class="scanner"></div>
            <img src="{{ url_for('static', filename='sign.png') }}" class="main-img" alt="AI Interface">
        </div>

        <div class="card card-text">
            <div class="label">Detected Text</div>
            <div style="font-size: 19px; font-weight: 700;">"Hello, how are you?"</div>
        </div>

        <div class="card card-voice">
            <div class="label" style="color:var(--accent-purple)">Speech Output</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 24px;">🔊</span>
                <div class="visualizer">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s; background: var(--accent-purple)"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s; background: var(--accent-purple)"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
