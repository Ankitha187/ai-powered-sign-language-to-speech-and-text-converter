<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sign Language Translator</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --card: #1e293b;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* --- FIXED HEADER --- */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between; /* Pushes content to opposite ends */
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 { margin: 0; color: var(--accent); font-size: 1.4rem; font-weight: 700; }

        .btn-home {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--accent);
            transform: translateX(-3px);
        }

        /* --- MAIN LAYOUT --- */
        .main-layout {
            display: flex;
            flex: 1;
            padding: 20px 40px;
            gap: 30px;
            align-items: center;
            justify-content: center;
            max-height: calc(100vh - 80px);
        }

        .video-container { 
            flex: 1.3;
            background: #000;
            border: 3px solid var(--accent); 
            border-radius: 24px; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            aspect-ratio: 4/3;
            max-height: 75vh;
        }

        canvas { width: 100%; height: 100%; object-fit: cover; }

        .controls-container {
            flex: 0.7;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 380px;
        }

        .result-card { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 24px; 
            text-align: center;
            border-bottom: 6px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .label { font-size: 0.7rem; text-transform: uppercase; color: #64748b; letter-spacing: 1.5px; margin-bottom: 8px; }

        #word { 
            font-size: 3.5rem; 
            color: var(--accent); 
            font-weight: 800; 
            margin: 5px 0; 
            min-height: 80px; 
            text-transform: uppercase; 
        }

        #sentence { 
            font-size: 1.2rem; 
            color: #cbd5e1; 
            min-height: 60px; 
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 16px;
            margin-top: 10px;
            line-height: 1.4;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        button { 
            padding: 16px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:active { transform: scale(0.98); }

        .btn-speak { background: #10b981; color: white; grid-column: span 2; }
        .btn-backspace { background: #f59e0b; color: white; }
        .btn-clear { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span style="font-size: 1.6rem;">🤟</span>
            <h1>AI Sign Translator</h1>
        </div>
        <a href="/" class="btn-home">
            <span>←</span> Back to Home
        </a>
    </header>

    <div class="main-layout">
        <div class="video-container">
            <video id="input_video" style="display:none;"></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div class="controls-container">
            <div class="result-card">
                <div class="label">Detected Sign</div>
                <div id="word">READY</div>
                
                <div class="label" style="margin-top: 25px;">Accumulated Sentence</div>
                <div id="sentence">Waiting for signs...</div>
            </div>

            <div class="btn-group">
                <button class="btn-speak" onclick="speakFullSentence()">🔊 Read Sentence</button>
                <button class="btn-backspace" onclick="backspace()">⌫ Backspace</button>
                <button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:5000', { transports: ['websocket'] });
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        let lastEmitTime = 0;

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#38bdf8', lineWidth: 1, radius: 2});
                
                const now = Date.now();
                if (now - lastEmitTime > 60) {
                    let flat = [];
                    landmarks.forEach(lm => flat.push(lm.x, lm.y, lm.z));
                    socket.emit('landmarks', flat);
                    lastEmitTime = now;
                }
            }
            canvasCtx.restore();
        });

        socket.on('prediction', (data) => {
            const wordEl = document.getElementById('word');
            wordEl.innerText = data.word;
            wordEl.style.color = (data.status === 'warning') ? "#ef4444" : "#38bdf8";
            document.getElementById('sentence').innerText = data.sentence;
            
            if (data.status === 'success' && data.word !== "REMOVED") {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(data.word.toLowerCase()));
            }
        });

        function backspace() { socket.emit('backspace'); }

        function speakFullSentence() {
            const text = document.getElementById('sentence').innerText;
            if (text && text !== "Waiting for signs...") {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            }
        }

        function clearAll() {
            socket.emit('clear_sentence');
            document.getElementById('word').innerText = "READY";
            document.getElementById('sentence').innerText = "";
        }

        const camera = new Camera(videoElement, { 
            onFrame: async () => { 
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                await hands.send({image: videoElement}); 
            }
        });
        camera.start();
    </script>
</body>
</html>
